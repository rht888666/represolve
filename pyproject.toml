[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "represolve"
version = "1.0.0"
description = "Replicate-resolved masked-gene completion benchmarking with regime routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "represolve authors", email = "TBD@institution.edu" }]
keywords = [
    "single-cell",
    "perturbation",
    "CRISPR",
    "benchmark",
    "masked-gene-completion",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/YOUR_USER/represolve"
Issues = "https://github.com/YOUR_USER/represolve/issues"
Documentation = "https://github.com/YOUR_USER/represolve#readme"

[tool.setuptools.packages.find]
where = ["src"]
