[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbeval"
version = "0.1.0"
description = "Replicate-resolved evaluation for perturbation-response models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scar_benchmark authors" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/scar-benchmark/perturbeval"
Issues = "https://github.com/scar-benchmark/perturbeval/issues"

[tool.setuptools.packages.find]
where = ["src"]
