[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "represolve"
version = "1.0.4"
description = "Replicate-resolved masked-gene completion benchmarking with regime routing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
  { name = "Haitao Ren", email = "rht@zju.edu.cn" },
  { name = "Yongan Xu", email = "xuyongan2000@zju.edu.cn" },
]
keywords = [
    "single-cell",
    "perturbation",
    "CRISPR",
    "benchmark",
    "masked-gene-completion",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/rht888666/represolve"
Issues = "https://github.com/rht888666/represolve/issues"
Documentation = "https://github.com/rht888666/represolve#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
represolve = ["DATA_MANIFEST.csv"]
